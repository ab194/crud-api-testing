name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.13']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run API tests
        run: python -m unittest discover -v
      - name: Validate Postman collection
        run: python -m json.tool postman_collection.json > /dev/null

  container:
    name: Docker Compose
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build and start API
        run: docker compose up --build --wait --wait-timeout 60
      - name: Check health endpoint
        run: curl --fail --silent --show-error http://127.0.0.1:8000/health
      - name: Stop API
        if: always()
        run: docker compose down
