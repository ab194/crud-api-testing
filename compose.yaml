services:
  api:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - items_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

volumes:
  items_data:
